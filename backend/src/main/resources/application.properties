server.port=8080

# Spring Application Name
spring.application.name=fitflex-hyderabad

# Default profile uses H2 database for out-of-the-box zero-setup execution
# To use PostgreSQL, run with -Dspring.profiles.active=postgres or set spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:mem:fitflexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration (Supports production JWT_SECRET environment variable)
fitflex.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
fitflex.jwt.expiration-ms=86400000

# Platform Settings
fitflex.platform.name=FitFlex Hyderabad
fitflex.platform.city=Hyderabad
fitflex.platform.cod-enabled=true
fitflex.platform.fee-percent=8.5
